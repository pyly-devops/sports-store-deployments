# External Secrets Operator's own namespace. Separate from `sports-store`
# because ESO is a platform component (project "platform" in argocd/projects),
# not part of the application — same reasoning as kube-system.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: sports-store-platform
