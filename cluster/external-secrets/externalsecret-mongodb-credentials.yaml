# Replaces k8s/secrets/apply-secrets.sh's `mongodb-credentials` Secret.
# Separate from app-secrets because the key name is not ours to choose — the
# Bitnami chart looks for exactly `mongodb-root-password`
# (helm/sports-store/values.yaml:315, mongodb.auth.existingSecret). Same
# remote secret as app-secrets, so the two can never drift relative to each
# other.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-credentials
  namespace: sports-store
spec:
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  refreshInterval: 1h # see externalsecret-app-secrets.yaml for why not 15s

  target:
    name: mongodb-credentials
    creationPolicy: Owner

  data:
    - secretKey: mongodb-root-password
      remoteRef: {key: sports-store/prod/app, property: MONGO_ROOT_PASSWORD}
