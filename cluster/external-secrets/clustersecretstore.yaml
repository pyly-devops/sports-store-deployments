# Cluster-scoped store, namespace-scoped effect. Without the
# conditions.namespaceSelector below, an ExternalSecret in ANY namespace could
# read sports-store/prod/app — a namespaced SecretStore would avoid that but
# would then have to live in `sports-store` and force
# external-secrets.io/SecretStore into the app's own AppProject whitelist,
# putting a platform concern inside the application's blast radius. This is
# the smaller compromise.
#
# Write external-secrets.io/v1, not v1beta1: ESO 2.x ships
# crds.unsafeServeV1Beta1: false, so v1beta1 here fails with
# "no matches for kind" — a failure that looks exactly like a CRD-ordering bug
# and isn't one.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # IRSA — no static key anywhere. The service account name/namespace here
      # must match envs/prod/irsa.tf's trust condition exactly
      # (system:serviceaccount:external-secrets:external-secrets) or
      # AssumeRoleWithWebIdentity fails with AccessDenied, surfacing only as
      # SecretSyncedError in a controller log.
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
  conditions:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: sports-store
