# Grafana's admin credential (Milestone 8), the same way app-secrets and
# mongodb-credentials already work: nothing is bootstrapped with `kubectl
# create secret`, because Milestone 7 exists to remove exactly that pattern.
#
# Same remote secret as app-secrets (sports-store/prod/app) rather than a
# second Secrets Manager entry — one more property on a secret this project
# already owns and rotates, not a new credential surface to manage.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  refreshInterval: 1h # see externalsecret-app-secrets.yaml for why not 15s

  target:
    name: grafana-admin
    creationPolicy: Owner
    # Matches kube-prometheus-stack/values.yaml's grafana.admin.userKey /
    # passwordKey exactly — those two key names are not ours to choose freely
    # once the chart values reference them.
    template:
      mergePolicy: Replace
      data:
        admin-user: admin
        admin-password: "{{ .password }}"

  data:
    - secretKey: password
      remoteRef: {key: sports-store/prod/app, property: GRAFANA_ADMIN_PASSWORD}
