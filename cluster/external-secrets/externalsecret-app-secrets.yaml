# Replaces k8s/secrets/apply-secrets.sh's `app-secrets` Secret. One remote
# secret (sports-store/prod/app: JWT_SECRET, MONGO_ROOT_USERNAME,
# MONGO_ROOT_PASSWORD) fans out into the five MONGO_URI keys the chart's
# services expect — see helm/sports-store/values.yaml:97-143 for the
# mongoUriKey each service reads.
#
# One remote secret is the answer to "how do five MONGO_URIs and
# mongodb-root-password stay consistent": there is nowhere for them to drift
# from.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: sports-store
spec:
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  # Not 15s: an accidental password rotation in Secrets Manager would
  # propagate into the cluster with no human in the loop, and (per T5 in the
  # M7 plan) that failure is invisible until the next pod restart — every pod
  # stays "1/1 Running" while every request fails Authentication failed. 1h
  # leaves time to notice via the rotation runbook before self-heal re-applies
  # a Secret nothing has restarted to pick up yet.
  refreshInterval: 1h

  target:
    name: app-secrets
    creationPolicy: Owner
    # Deliberately not Merge: the three raw fetched values (jwt, user,
    # password) are template INPUTS, and Replace is what stops them leaking
    # into the rendered Secret's own keys.
    template:
      mergePolicy: Replace
      data:
        JWT_SECRET: "{{ .jwt }}"
        AUTH_MONGO_URI: "mongodb://{{ .user }}:{{ .password }}@mongodb:27017/?authSource=admin"
        CATALOG_MONGO_URI: "mongodb://{{ .user }}:{{ .password }}@mongodb:27017/?authSource=admin"
        CART_MONGO_URI: "mongodb://{{ .user }}:{{ .password }}@mongodb:27017/?authSource=admin"
        ORDER_MONGO_URI: "mongodb://{{ .user }}:{{ .password }}@mongodb:27017/?authSource=admin"
        PAYMENT_MONGO_URI: "mongodb://{{ .user }}:{{ .password }}@mongodb:27017/?authSource=admin"

  # Named refs, not dataFrom.extract: the template above needs .jwt/.user/
  # .password as distinct inputs, and extract would instead dump the remote
  # secret's own key names (JWT_SECRET, MONGO_ROOT_USERNAME,
  # MONGO_ROOT_PASSWORD) straight into the target — which the template.data
  # block already re-derives under the names the template expects, so both at
  # once means the target renders extra keys nothing consumes.
  data:
    - secretKey: jwt
      remoteRef: {key: sports-store/prod/app, property: JWT_SECRET}
    - secretKey: user
      remoteRef: {key: sports-store/prod/app, property: MONGO_ROOT_USERNAME}
    - secretKey: password
      remoteRef: {key: sports-store/prod/app, property: MONGO_ROOT_PASSWORD}
