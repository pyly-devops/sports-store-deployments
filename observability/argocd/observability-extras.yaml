# The Grafana dashboard, as an Argo CD Application.
#
# The only single-source Application of the four: the chart is in this repo,
# so there is no upstream to combine with and no $values indirection needed.
#
# Wave 1, after the monitoring stack at wave -1. The dashboard is delivered as
# a ConfigMap that Grafana's sidecar picks up, so it does not strictly need
# Grafana to exist first - a ConfigMap applies fine on its own and the sidecar
# collects it whenever it starts. The ordering is for the demo: a dashboard
# that appears before Grafana does looks like it failed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-extras
  namespace: argocd # M7: the namespace Argo CD itself runs in
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    # Without this, deleting the Application orphans everything it created,
    # including PVCs that keep billing.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default # M7: the AppProject name

  source:
    repoURL: https://github.com/pyly-devops/sports-store-deployments.git
    targetRevision: main
    path: observability/extras

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
