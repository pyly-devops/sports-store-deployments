# Grafana Alloy, as an Argo CD Application.
#
# Wave 1, AFTER Loki. Alloy starts pushing as soon as it is up; with no Loki
# Service to resolve it spends its first minutes logging connection errors -
# harmless, but it makes a clean install look broken during a demo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd # M7: the namespace Argo CD itself runs in
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    # Without this, deleting the Application orphans everything it created,
    # including PVCs that keep billing.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default # M7: the AppProject name

  # Multi-source: chart from upstream, values from this repo. Keeps our
  # configuration reviewable in Git without vendoring a third-party chart.
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      # Pinned exactly - `latest` is banned project-wide.
      targetRevision: 1.11.0
      helm:
        valueFiles:
          - $values/observability/alloy/values.yaml
    - repoURL: https://github.com/pyly-devops/sports-store-deployments.git
      targetRevision: main
      # `ref` only publishes the repo for valueFiles above; it renders nothing.
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
