# kube-prometheus-stack, as an Argo CD Application.
#
# ---------------------------------------------------------------------------
# THREE THINGS IN THIS FILE NEED CONFIRMING AGAINST THE MILESTONE 7 SETUP
# before it is applied. They are marked M7 below. Nothing else here depends
# on how Argo CD was installed.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd # M7: the namespace Argo CD itself runs in
  annotations:
    # ORDERING, AND IT MATTERS.
    #
    # This Application installs the Prometheus Operator's CRDs, including
    # ServiceMonitor. The sports-store Application renders six ServiceMonitors.
    # Sync them the other way round and the application's sync fails outright
    # with "no matches for kind ServiceMonitor".
    #
    # A negative wave sorts this ahead of anything at the default wave 0.
    #
    # Sync waves only order Applications relative to each other when something
    # owns them together - an app-of-apps root, or an ApplicationSet. If M7
    # applies Applications individually this annotation is inert, which is
    # exactly why the application chart ALSO guards its ServiceMonitors behind
    # `metrics.enabled`. Two independent defences, because this one depends on
    # a structural decision that is not mine.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    # Without this, deleting the Application orphans every object it created -
    # including a 20Gi PVC that keeps billing.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default # M7: the AppProject name, and see the note at the bottom

  # Multi-source: the chart comes from upstream, the values from this repo.
  # This keeps our configuration reviewable in Git without vendoring a
  # ~600KB third-party chart into the repository.
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      # Pinned exactly. `latest` is banned project-wide, and for a chart this
      # large an unpinned version means a sync can rewrite CRDs without anyone
      # having changed a file.
      targetRevision: 88.1.5
      helm:
        valueFiles:
          # $values resolves to the ref: source below.
          - $values/observability/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/pyly-devops/sports-store-deployments.git
      targetRevision: main
      # `ref` alone means "make this repo available for valueFiles" - it does
      # NOT render anything from it. Without this the values file cannot be
      # addressed at all.
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # REQUIRED FOR THIS CHART SPECIFICALLY.
      #
      # Several Prometheus Operator CRDs are larger than the 262144-byte limit
      # on the last-applied-configuration annotation that client-side apply
      # writes. Without server-side apply the sync fails with
      #
      #   metadata.annotations: Too long: must have at most 262144 bytes
      #
      # which reads as a validation error about annotations and gives no hint
      # that the fix is the apply strategy.
      - ServerSideApply=true
  # Prometheus rewrites parts of its own resources after creation, so a strict
  # diff shows this Application as permanently OutOfSync.
  ignoreDifferences:
    - group: monitoring.coreos.com
      kind: Prometheus
      jsonPointers:
        - /spec/replicas
---
# M7 NOTE - the one thing that will reject all four of these.
#
# If the AppProject restricts `sourceRepos` to this organisation's own Git
# repositories, every Application here fails with
#
#   application repo <url> is not permitted in project <name>
#
# because three of the four pull their chart from an upstream Helm repository.
# The project needs these entries in sourceRepos:
#
#   - https://github.com/pyly-devops/*
#   - https://prometheus-community.github.io/helm-charts
#   - https://grafana.github.io/helm-charts
#
# and `observability` in destinations. Worth checking before the first sync
# rather than debugging it live.
