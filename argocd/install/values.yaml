# argo-cd chart 10.2.3 install values.
#
# NOT A MANIFEST — argocd/bootstrap.yaml's root Application explicitly
# excludes this file from its directory.recurse walk. It is consumed exactly
# once, by the `helm upgrade --install argocd` bootstrap command in README.md.
#
# T10 (M7 plan): a t3.small cluster has very little headroom, and this chart
# defaults to 7 pods with resources: {} on most of them — invisible to the
# scheduler, first to be OOM-killed. dex and notifications are unused by this
# project and disabled outright. applicationSet has NO enabled toggle in this
# chart version — verified against `helm show values` before assuming
# otherwise; every Application here is hand-written anyway, so it just gets a
# resource budget instead of being removable. Every remaining pod gets
# explicit requests. Re-measure with
# `kubectl describe node | grep -A8 Allocatable` after bootstrap — the plan's
# original 2-node assumption was short even before this chart; see
# docs/status.md for the node-count fix this forced.

dex:
  enabled: false # no SSO/OIDC login integration in this project

# NOT notifications.controller.enabled — that key doesn't exist in this
# chart. The real toggle is top-level, confirmed against `helm show values
# argo/argo-cd --version 10.2.3`.
notifications:
  enabled: false # no Slack/webhook notifications configured

controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

server:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
  # UI reached only via `kubectl port-forward` (M7 plan decision 2) — the
  # gateway's ALB stays the only thing reachable from outside the cluster.
  service:
    type: ClusterIP
  extraArgs:
    - --insecure # port-forward is already an authenticated path (kubeconfig); TLS here buys nothing extra

repoServer:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

# Milestone 8 (verification pass, 2026-08-06): this key was
# `applicationSetController`, which is not a key this chart recognises — Helm
# silently drops unknown top-level values keys instead of erroring, so the
# resources block below never reached the pod. Live confirmation before the
# fix: `kubectl get deploy -n argocd argocd-applicationset-controller -o
# jsonpath='{.spec.template.spec.containers[*].resources}'` returned `{}`.
# The chart's real key is `applicationSet` (confirmed against `helm show
# values argo/argo-cd --version 10.2.3`).
#
# replicas: 0 rides along in the same edit — applicationSet has no `enabled`
# toggle in this chart version, so scaling to zero is the only disable
# available, and it is safe because every Application in this project is
# hand-written; nothing depends on an ApplicationSet controller running.
# Two things worth knowing if this is ever reverted:
#   - it is a DISGUISED disable: a future ApplicationSet CR would be accepted
#     by the API server and then silently never reconciled — no controller,
#     no error, no event.
#   - `kubectl get deploy -n argocd` will show `0/0`, which reads as crashed
#     rather than intentionally idle.
# applicationSet.pdb.enabled defaults to false, so no PodDisruptionBudget is
# left behind to block a node drain at zero replicas.
applicationSet:
  replicas: 0
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

redis:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}
