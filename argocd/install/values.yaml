# argo-cd chart 10.2.3 install values.
#
# NOT A MANIFEST — argocd/bootstrap.yaml's root Application explicitly
# excludes this file from its directory.recurse walk. It is consumed exactly
# once, by the `helm upgrade --install argocd` bootstrap command in README.md.
#
# T10 (M7 plan): a 2-node t3.small cluster has very little headroom, and this
# chart defaults to 7 pods with resources: {} on three of them — invisible to
# the scheduler, first to be OOM-killed. None of dex/notifications/
# applicationSet are used by this project, so they're disabled outright
# rather than just resourced, and every remaining pod gets explicit requests.
# Budget: ~950Mi total. Re-measure with
# `kubectl describe node | grep -A8 Allocatable` after bootstrap — bump the
# node group to t3.medium (M8 needs it anyway) if short, rather than trust
# this comment's arithmetic.

dex:
  enabled: false # no SSO/OIDC login integration in this project

notifications:
  controller:
    enabled: false # no Slack/webhook notifications configured

applicationSet:
  enabled: false # every Application here is hand-written, not templated from a generator

controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

server:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
  # UI reached only via `kubectl port-forward` (M7 plan decision 2) — the
  # gateway's ALB stays the only thing reachable from outside the cluster.
  service:
    type: ClusterIP
  extraArgs:
    - --insecure # port-forward is already an authenticated path (kubeconfig); TLS here buys nothing extra

repoServer:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

applicationSetController:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

redis:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}
