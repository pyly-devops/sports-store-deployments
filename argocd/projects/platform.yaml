# Cluster-scoped platform components: namespaces, ESO, the storage class, the
# ALB controller. Separate from the "sports-store" project below because the
# honest answer to "what cluster-scoped resources does the app need?" is
# NONE — one project would have to grant CRD/ClusterRole/StorageClass rights
# to the app just to satisfy the platform.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Cluster-scoped platform components (namespaces, ESO, storage, ALB controller)

  sourceRepos:
    - https://github.com/pyly-devops/sports-store-deployments
    # Chart-sourced Applications fail at sync time with "application repo …
    # is not permitted in project" unless the chart's own repo is listed here
    # too — sourceRepos matches the Helm repo URL, not just git remotes.
    - https://charts.external-secrets.io
    - https://aws.github.io/eks-charts

  destinations:
    - namespace: kube-system
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: sports-store
      server: https://kubernetes.default.svc

  # Only what the platform Applications actually render. CRD and
  # ClusterRole/ClusterRoleBinding are here because ESO and the ALB
  # controller ship their own; the rest are genuinely cluster-scoped objects
  # each of them creates.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: storage.k8s.io
      kind: StorageClass
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: networking.k8s.io
      kind: IngressClass
    - group: elbv2.k8s.aws
      kind: IngressClassParams
    - group: external-secrets.io
      kind: ClusterSecretStore
