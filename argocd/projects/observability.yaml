# kube-prometheus-stack, Loki, Alloy and the dashboard ConfigMap. A third
# AppProject rather than widening "platform" — these Applications pull from
# two upstream Helm repos nothing else in this repository needs, and
# widening platform's sourceRepos would hand that access to the ALB
# controller and ESO Applications too.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
spec:
  description: kube-prometheus-stack, Loki, Alloy and the dashboard ConfigMap — observability namespace only

  sourceRepos:
    - https://github.com/pyly-devops/sports-store-deployments
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts

  destinations:
    - namespace: observability
      server: https://kubernetes.default.svc
    # Found live, not by rendering: kube-prometheus-stack's kubeProxy and
    # coredns components (both left at their chart default of enabled —
    # unlike kubeEtcd/kubeScheduler/kubeControllerManager, §3.9, both have
    # real pods on EKS) each ship a synthetic headless Service in
    # kube-system, alongside the actual kube-proxy DaemonSet / coredns
    # Deployment, so their ServiceMonitors have something to select. `helm
    # template --include-crds` renders these correctly, but a plain string
    # scan for "namespace: observability" across the render would have
    # missed them — they were only found by enumerating every distinct
    # `namespace:` value in the actual output. Without this, the monitoring
    # Application spins forever: "one or more synchronization tasks are not
    # valid: namespace kube-system is not permitted in project
    # 'observability'".
    - namespace: kube-system
      server: https://kubernetes.default.svc

  # Enumerated from the actual render (helm template all four sources with
  # the pinned versions and our values files), not guessed — same discipline
  # as projects/sports-store.yaml. kube-prometheus-stack owns almost all of
  # this: its CRDs, the Prometheus Operator's ClusterRole/Binding and
  # admission webhook, and the two aggregated view/edit ClusterRoles it
  # wires into the built-in kube-system RBAC.
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration

  orphanedResources:
    warn: true
