# The application, and nothing else. One source repo, one destination
# namespace, deny-all on cluster-scoped resources.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sports-store
  namespace: argocd
spec:
  description: The sports-store Helm release — application-scoped resources only

  sourceRepos:
    - https://github.com/pyly-devops/sports-store-deployments

  destinations:
    - namespace: sports-store
      server: https://kubernetes.default.svc

  # Empty list is deny-all, not "unset" — the app needs zero cluster-scoped
  # resources, and leaving this out entirely would default-allow instead.
  clusterResourceWhitelist: []

  # Enumerated from the actual chart render (helm template --dry-run against
  # the exact 7 -f flags used by the Application below), not guessed. The
  # highest-value line is the one that ISN'T here: Secret. If secrets.create
  # ever flips to true, that turns a committed plaintext credential into a
  # loud sync failure instead of a quiet one in a live cluster.
  #
  # ServiceMonitor added for M8 (PR #21, templates/servicemonitor.yaml):
  # missed in that PR's own review — caught live during Tier 2/3 sync
  # convergence when the Application sat OutOfSync/Failed with "resource
  # monitoring.coreos.com:ServiceMonitor is not permitted in project
  # sports-store". Same class of gap as PR #22 (kube-system destination):
  # a whitelist that has to be updated by hand alongside every template
  # that ships a new resource kind, and nothing forces the two edits to
  # land in the same PR.
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: Ingress
    - group: monitoring.coreos.com
      kind: ServiceMonitor

  orphanedResources:
    warn: true
