# Wave 20: first consumer of the CRDs wave 10 installed. Directory-type
# Application over cluster/external-secrets/ (ClusterSecretStore + the two
# ExternalSecrets) — never a Helm chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: platform
  source:
    repoURL: https://github.com/pyly-devops/sports-store-deployments
    targetRevision: main
    path: cluster/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: sports-store
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff: {duration: 15s, factor: 2, maxDuration: 5m}
