# Wave 35: nothing in this cluster depends on Loki's CRDs (it has none), so
# it only needs to sync after the namespace and storage class exist — but it
# sits after monitoring (25) and before alloy (36), because Alloy is useless
# with nowhere to ship to and a clean install should not spend its first
# minutes logging connection errors during a demo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "35"
  finalizers:
    # Without this, deleting the Application orphans everything it created,
    # including the 5Gi PVC that keeps billing.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability

  # Multi-source: chart from upstream, values from this repo. Keeps our
  # configuration reviewable in Git without vendoring a third-party chart.
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      # Pinned exactly — `latest` is banned project-wide.
      targetRevision: 7.2.0
      helm:
        valueFiles:
          - $values/observability/loki/values.yaml
    - repoURL: https://github.com/pyly-devops/sports-store-deployments.git
      targetRevision: main
      # `ref` only publishes the repo for valueFiles above; it renders
      # nothing on its own.
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff: {duration: 15s, factor: 2, maxDuration: 5m}
