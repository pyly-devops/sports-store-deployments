# Wave 36: after Loki (35), or Alloy spends its first minutes logging
# connection errors to a Service that does not exist yet — harmless, but it
# makes a clean install look broken during a demo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "36"
  finalizers:
    # Without this, deleting the Application orphans everything it created.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability

  # Multi-source: chart from upstream, values from this repo. Keeps our
  # configuration reviewable in Git without vendoring a third-party chart.
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      # Pinned exactly — `latest` is banned project-wide.
      targetRevision: 1.11.0
      helm:
        valueFiles:
          - $values/observability/alloy/values.yaml
    - repoURL: https://github.com/pyly-devops/sports-store-deployments.git
      targetRevision: main
      # `ref` only publishes the repo for valueFiles above; it renders
      # nothing on its own.
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff: {duration: 15s, factor: 2, maxDuration: 5m}
