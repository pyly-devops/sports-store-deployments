# Wave 10: CRDs must exist before any Application that creates a CR of that
# kind (wave 20's cluster-secrets). Separate Application from the CRs
# themselves — Argo dry-runs a sync's whole manifest set up front, so a CR in
# the same Application as its own CRD fails with "no matches for kind".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.8.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true

        # serviceAccount.name is PINNED, not derived from the chart's
        # fullname helper. envs/prod/irsa.tf's trust condition is
        # system:serviceaccount:external-secrets:external-secrets — a rename
        # here silently breaks AssumeRoleWithWebIdentity, surfacing as
        # SecretSyncedError with an AccessDenied buried in a controller log,
        # not as a sync failure.
        serviceAccount:
          create: true
          name: external-secrets
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::638920471904:role/sports-store-external-secrets

        # The chart ships {} on all three deployments, leaving them
        # BestEffort and invisible to the scheduler (T10).
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 128Mi}
        webhook:
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 128Mi}
        certController:
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 128Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      # MANDATORY, not stylistic: templates/crds/clustersecretstore.yaml
      # renders to 687,692 bytes. Client-side apply writes that into the
      # kubectl.kubernetes.io/last-applied-configuration annotation, whose
      # ceiling is 262,144 — the sync dies with
      # "metadata.annotations: Too long" without this.
      - ServerSideApply=true
      - CreateNamespace=false
    retry:
      limit: 5
      backoff: {duration: 15s, factor: 2, maxDuration: 5m}
