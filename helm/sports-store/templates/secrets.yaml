{{/*
================================================================================
  Secrets — rendered ONLY when secrets.create is true, which is NOT the default.

  Default path (create: false): the two Secrets are created out of band by
  k8s/secrets/apply-secrets.sh, which reads a gitignored .env. A Secret manifest
  with real values in stringData is a plaintext credential in git, and base64 is
  encoding, not encryption. That script stays the supported route, and is also
  the seam the External Secrets Operator plugs into later — ESO owns
  `app-secrets`, this chart consumes it, no template changes.

  Opt-in path (create: true): for `helm install --set secrets.jwtSecret=... ` or
  a gitignored values file, so a one-command install is possible in a throwaway
  cluster. The `required` guards in _helpers.tpl mean this cannot silently ship
  an empty password — it fails at render time.

  NEVER commit a values file with these populated.
================================================================================
*/}}
{{- if .Values.secrets.create }}
{{- $mongoUri := include "sports-store.mongoUri" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sports-store.secretName" . }}
  labels: {{- include "sports-store.labels" (dict "ctx" . "name" "app-secrets" "component" "config") | nindent 4 }}
type: Opaque
stringData:
  # One symmetric secret shared by all five services. Called out rather than
  # hidden: any service that can VERIFY a token could also FORGE one. Asymmetric
  # signing (auth-service holds the private key, the rest verify with the public
  # one) is the correct fix and is a known gap.
  JWT_SECRET: {{ required "secrets.jwtSecret is required when secrets.create is true" .Values.secrets.jwtSecret | quote }}
  {{- /*
    One key per service, generated from the same helper. They hold identical
    values today because each service hardcodes its database name in database.py
    (client["auth_db"], ...) rather than reading it from the URI. The separate
    keys are kept anyway: they make the database-per-service boundary explicit
    and let one service's credentials rotate without touching the other four.
    Driven off the same `services` map, so adding a sixth service with a
    mongoUriKey cannot forget to add its key here.
  */}}
  {{- range $name, $svc := .Values.services }}
  {{- if $svc.mongoUriKey }}
  {{ $svc.mongoUriKey }}: {{ $mongoUri | quote }}
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sports-store.mongoSecretName" . }}
  labels: {{- include "sports-store.labels" (dict "ctx" . "name" "mongodb" "component" "database") | nindent 4 }}
type: Opaque
stringData:
  # Key name dictated by the Bitnami chart, which looks for exactly this string.
  # That is precisely why this is a separate Secret rather than another key in
  # app-secrets: mixing a chart-dictated name into the application's own Secret
  # couples the two for no benefit.
  mongodb-root-password: {{ required "secrets.mongodbRootPassword is required when secrets.create is true" .Values.secrets.mongodbRootPassword | quote }}
{{- end }}
