# TODO: stringData (plaintext here is fine for a local-cluster starter file
#   — kubectl/etcd still store it base64-encoded either way; just don't
#   commit real production credentials to this file):
#   - JWT_SECRET: same value every service must share — see each
#     services/*/.env.example's JWT_SECRET. All 5 services trust one shared
#     secret to verify each other's tokens (see README.md "Inter-service
#     trust").
#   - MONGO_ROOT_USERNAME / MONGO_ROOT_PASSWORD: credentials for the Bitnami
#     MongoDB chart's root user — see ../mongodb/values.yaml. Pick something;
#     these two values must be identical in both files.
#   - one MONGO_URI key per service (e.g. AUTH_MONGO_URI, CATALOG_MONGO_URI,
#     CART_MONGO_URI, ORDER_MONGO_URI, PAYMENT_MONGO_URI): each is a full
#     Mongo connection string using the root credentials above, the MongoDB
#     Service's cluster DNS name (from the Bitnami chart — check what Service
#     name `helm install` actually creates before hardcoding it here), and a
#     DIFFERENT database name per service (see README.md's "database-per-
#     service" design note — auth_db, catalog_db, cart_db, order_db,
#     payment_db). Each Deployment maps its own key to a MONGO_URI env var
#     via secretKeyRef — see e.g. ../auth-service/deployment.yaml.
#
# Do not put JWT_SECRET or MONGO_URI in a ConfigMap — anything with
# credentials in it belongs in a Secret, not a ConfigMap (ConfigMaps aren't
# encrypted at rest and show up in plaintext in `kubectl get configmap -o
# yaml`).
