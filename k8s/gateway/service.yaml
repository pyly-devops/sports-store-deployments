# The only Service in this directory reachable from outside the cluster.
#
# NodePort rather than LoadBalancer: minikube has no cloud load balancer to
# provision, so a LoadBalancer Service would sit <pending> forever unless
# `minikube tunnel` is running. NodePort works on any local cluster with
# nothing extra.
#
# A NodePort Service still gets a ClusterIP, so ./ingress.yaml routes to it
# perfectly well. The two are complements, not alternatives:
#
#   Ingress   -> http://sports-store.local        the documented path, and the
#                                                 shape Milestone 5 reuses with
#                                                 an ALB on EKS
#   NodePort  -> http://<minikube ip>:30080       always works, no addon and no
#                                                 /etc/hosts entry needed
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: sports-store
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      # Pinned instead of letting Kubernetes allocate from the 30000-32767
      # range, so the URL in the README stays true across a `kubectl delete`
      # and re-apply.
      nodePort: 30080
      protocol: TCP
