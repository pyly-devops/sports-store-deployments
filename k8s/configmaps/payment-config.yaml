# Non-secret configuration for payment-service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: sports-store
data:
  # The demo payment gateway declines any card number ending in this suffix,
  # which is how the checkout saga's failure path (HTTP 402 -> order marked
  # payment_failed) is exercised without a real payment provider. Config, not a
  # secret -- knowing it grants nothing.
  PAYMENT_FAILURE_SUFFIX: "0000"
