# Non-secret configuration for cart-service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cart-config
  labels:
    app.kubernetes.io/name: cart-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: sports-store
data:
  # cart-service calls catalog-service over REST to validate SKUs and prices --
  # it never reads catalog_db directly. That REST hop is what actually enforces
  # the database-per-service boundary.
  #
  # The hostname is the Kubernetes Service name, resolved by cluster DNS, and
  # the port is 8000 because that is what every service listens on inside its
  # container (see each Dockerfile). NOT localhost: a pod's localhost is the
  # pod itself, so a loopback URL here would try to reach cart-service.
  #
  # This value is byte-for-byte identical to the one in docker-compose.yml,
  # because the Compose service names were chosen up front to match the
  # Kubernetes Service names.
  CATALOG_URL: http://catalog-service:8000
