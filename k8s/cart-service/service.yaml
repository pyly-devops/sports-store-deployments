# Stable in-cluster address for cart-service.
#
# Resolved by the gateway's /api/cart location block and by order-service's
# CART_URL during checkout. Name and port 8000 are fixed by nginx.conf -- see
# ../auth-service/service.yaml.
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  labels:
    app.kubernetes.io/name: cart-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: sports-store
spec:
  selector:
    app: cart-service
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
