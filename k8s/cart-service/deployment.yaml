# cart-service -- per-user carts. Calls catalog-service over REST to validate
# SKUs and prices; it never reads catalog_db directly.
#
# See ../auth-service/deployment.yaml for the commentary on the shared shape.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  labels:
    app.kubernetes.io/name: cart-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: sports-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
        app.kubernetes.io/name: cart-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: sports-store
    spec:
      containers:
        - name: cart-service
          image: sports-store/cart-service:0.1.0-c01139d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: CART_MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
          envFrom:
            # Supplies CATALOG_URL. There is deliberately no startup ordering
            # against catalog-service: if catalog is down, cart returns errors
            # on the affected requests and recovers on its own once it is back.
            - configMapRef:
                name: cart-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
