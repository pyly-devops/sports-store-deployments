# Stable in-cluster address for auth-service.
#
# TWO things here are not free choices:
#
#   1. metadata.name must be exactly "auth-service", because
#      gateway/nginx.conf contains `proxy_pass http://auth-service:8000` and
#      that file is baked into the gateway image. A different name here means
#      an NXDOMAIN in the gateway's logs and a 502 on every /api/auth/*
#      request.
#   2. port must be 8000, not the conventional 80, for the same reason -- the
#      port is part of that proxy_pass line. Reusing the container's own port
#      also keeps `kubectl port-forward svc/auth-service 8000:8000` and the
#      Compose setup reading the same way.
#
# No `type:` -- ClusterIP is the default and is what is wanted. Only the
# gateway is reachable from outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: sports-store
spec:
  selector:
    # Matches the Deployment's POD TEMPLATE labels, not the Deployment's own
    # metadata. A Service selects pods directly; it has no knowledge of the
    # Deployment that created them.
    app: auth-service
  ports:
    - name: http
      port: 8000
      # The named port from the Deployment's container spec, so this survives
      # a container port change without an edit here.
      targetPort: http
      protocol: TCP
